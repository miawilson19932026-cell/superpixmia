<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circle -->
  <circle cx="600" cy="200" r="300" fill="url(#glow)"/>

  <!-- Icon: pixel grid — 5x4 block pattern -->
  <g transform="translate(100, 120)">
    <rect x="0"   y="0"   width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="48"  y="0"   width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="96"  y="0"   width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="144" y="0"   width="40" height="40" rx="8" fill="#FAFAFA"/>

    <rect x="0"   y="48"  width="40" height="40" rx="8" fill="#FAFAFA" opacity="0.3"/>
    <rect x="48"  y="48"  width="40" height="40" rx="8" fill="#FAFAFA" opacity="0"/>
    <rect x="96"  y="48"  width="40" height="40" rx="8" fill="#FAFAFA" opacity="0"/>
    <rect x="144" y="48"  width="40" height="40" rx="8" fill="#FAFAFA"/>

    <rect x="0"   y="96"  width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="48"  y="96"  width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="96"  y="96"  width="40" height="40" rx="8" fill="#FAFAFA"/>
    <rect x="144" y="96"  width="40" height="40" rx="8" fill="#FAFAFA"/>

    <rect x="0"   y="144" width="40" height="40" rx="8" fill="#FAFAFA" opacity="0.3"/>
    <rect x="48"  y="144" width="40" height="40" rx="8" fill="#FAFAFA" opacity="0"/>
    <rect x="96"  y="144" width="40" height="40" rx="8" fill="#FAFAFA" opacity="0"/>
    <rect x="144" y="144" width="40" height="40" rx="8" fill="#FAFAFA" opacity="0"/>
  </g>

  <!-- Brand name -->
  <text x="320" y="180" font-family="'SF Pro Display','Inter',-apple-system,BlinkMacSystemFont,sans-serif" font-size="42" font-weight="300" fill="#A0A0A0" letter-spacing="12">
    SUPER
  </text>
  <text x="320" y="240" font-family="'SF Pro Display','Inter',-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="700" fill="#FAFAFA" letter-spacing="2">
    PixMia
  </text>

  <!-- Tagline -->
  <text x="100" y="340" font-family="'SF Pro Display','Inter',-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="400" fill="#A0A0A0">
    Free Online Image Tools — 100% Private, All in Your Browser
  </text>

  <!-- Feature pills -->
  <g transform="translate(100, 390)">
    <rect x="0"   y="0" width="190" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="95"  y="33" font-family="monospace" font-size="22" font-weight="600" fill="#3B82F6" text-anchor="middle">Resize</text>

    <rect x="210" y="0" width="210" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="315" y="33" font-family="monospace" font-size="22" font-weight="600" fill="#8B5CF6" text-anchor="middle">Compress</text>

    <rect x="440" y="0" width="260" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#A855F7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="570" y="33" font-family="monospace" font-size="22" font-weight="600" fill="#A855F7" text-anchor="middle">Remove BG</text>

    <rect x="720" y="0" width="230" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3"/>
    <text x="835" y="33" font-family="monospace" font-size="22" font-weight="600" fill="#6366F1" text-anchor="middle">Convert</text>
  </g>

  <!-- Footer bar -->
  <rect x="100" y="510" width="1000" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="600" y="560" font-family="'SF Pro Display','Inter',-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="400" fill="#A0A0A0" fill-opacity="0.6" text-anchor="middle">
    Zero server · 100% privacy · PNG / JPEG / WebP / AVIF / GIF / BMP / SVG / ICO / TIFF
  </text>
</svg>
