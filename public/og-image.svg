<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="orbBlue" cx="0.1" cy="0.08" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.0" r="0.4">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCenter" cx="0.30" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Platform dark background (#050510 near-black + brand orbs) -->
  <rect width="1200" height="630" fill="#050510"/>
  <rect width="1200" height="630" fill="url(#orbBlue)"/>
  <rect width="1200" height="630" fill="url(#orbPurple)"/>
  <rect width="1200" height="630" fill="url(#orbCyan)"/>
  <rect width="1200" height="630" fill="url(#orbCenter)"/>

  <!-- Pixel P logo (left, 100px blocks, 24px gap) -->
  <g fill="#FAFAFA">
    <rect x="110" y="79"  width="100" height="100" rx="22"/>
    <rect x="234" y="79"  width="100" height="100" rx="22"/>
    <rect x="358" y="79"  width="100" height="100" rx="22"/>
    <rect x="482" y="79"  width="100" height="100" rx="22"/>

    <rect x="110" y="203" width="100" height="100" rx="22"/>
    <rect x="482" y="203" width="100" height="100" rx="22"/>

    <rect x="110" y="327" width="100" height="100" rx="22"/>
    <rect x="234" y="327" width="100" height="100" rx="22"/>
    <rect x="358" y="327" width="100" height="100" rx="22"/>
    <rect x="482" y="327" width="100" height="100" rx="22"/>

    <rect x="110" y="451" width="100" height="100" rx="22"/>
  </g>

  <!-- Brand + tagline (right) -->
  <text x="640" y="248" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="600" fill="#FAFAFA" letter-spacing="3">SuperPixMia</text>

  <!-- Gradient divider -->
  <rect x="644" y="286" width="280" height="3" rx="1.5" fill="url(#divider)"/>

  <text x="644" y="400" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif" font-size="32" font-weight="400" fill="#B4BEC9" letter-spacing="1">Compress · Remove BG · Convert</text>
  <text x="644" y="455" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" font-weight="400" fill="#7B8494" letter-spacing="1">Resize · Watermark · Crop · Rotate</text>

  <text x="644" y="548" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="400" fill="#6B7280" letter-spacing="1">100% in your browser · No upload · Free</text>
</svg>
