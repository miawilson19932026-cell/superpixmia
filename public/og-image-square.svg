<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="orbBlue" cx="0.18" cy="0.08" r="0.6">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.98" r="0.4">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Platform dark background (#050510 + brand orbs) -->
  <rect width="1024" height="1024" fill="#050510"/>
  <rect width="1024" height="1024" fill="url(#orbBlue)"/>
  <rect width="1024" height="1024" fill="url(#orbPurple)"/>
  <rect width="1024" height="1024" fill="url(#orbCyan)"/>

  <!-- Pixel P logo (4x4, 120px blocks, 28px gap) -->
  <g fill="#FAFAFA">
    <rect x="230" y="130" width="120" height="120" rx="26"/>
    <rect x="378" y="130" width="120" height="120" rx="26"/>
    <rect x="526" y="130" width="120" height="120" rx="26"/>
    <rect x="674" y="130" width="120" height="120" rx="26"/>

    <rect x="230" y="288" width="120" height="120" rx="26"/>
    <rect x="674" y="288" width="120" height="120" rx="26"/>

    <rect x="230" y="436" width="120" height="120" rx="26"/>
    <rect x="378" y="436" width="120" height="120" rx="26"/>
    <rect x="526" y="436" width="120" height="120" rx="26"/>
    <rect x="674" y="436" width="120" height="120" rx="26"/>

    <rect x="230" y="584" width="120" height="120" rx="26"/>
  </g>

  <!-- Brand name -->
  <text x="512" y="800" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="600" fill="#FAFAFA" letter-spacing="3" text-anchor="middle">SuperPixMia</text>

