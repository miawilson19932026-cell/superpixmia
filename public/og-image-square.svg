  <text x="512" y="902" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="48" font-weight="400" fill="#9CA3AF" letter-spacing="2" text-anchor="middle">图片压缩 · 抠图 · 去水印</text>
  <text x="512" y="966" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="48" font-weight="400" fill="#9CA3AF" letter-spacing="2" text-anchor="middle">格式转换 · 免费免上传</text>
