<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="rgba(250,250,250,0.12)" stroke-width="1.5"/>

  <!-- Pixel "P" mark — 5 columns × 5 rows grid, centered -->
  <g transform="translate(22, 22)">
    <!-- Row 0: ████ (all filled) -->
    <rect x="0"  y="0"  width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="20" y="0"  width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="40" y="0"  width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="60" y="0"  width="18" height="18" rx="3.5" fill="#fafafa"/>

    <!-- Row 1: █  █ (first + last only) -->
    <rect x="0"  y="20" width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="60" y="20" width="18" height="18" rx="3.5" fill="#fafafa"/>

    <!-- Row 2: ████ (all filled) -->
    <rect x="0"  y="40" width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="20" y="40" width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="40" y="40" width="18" height="18" rx="3.5" fill="#fafafa"/>
    <rect x="60" y="40" width="18" height="18" rx="3.5" fill="#fafafa"/>

    <!-- Row 3: █ (first only — leg of P) -->
    <rect x="0"  y="60" width="18" height="18" rx="3.5" fill="#fafafa"/>

    <!-- Row 4: █ (first only — leg of P) -->
    <rect x="0"  y="80" width="18" height="18" rx="3.5" fill="#fafafa"/>
  </g>
</svg>
