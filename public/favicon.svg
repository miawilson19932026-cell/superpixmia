<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Pixel "P" mark — exact match with logo: 4 columns × 4 rows -->
  <g transform="translate(29, 29)">
    <!-- Row 0: ████ -->
    <rect x="0"  y="0"  width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="18" y="0"  width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="36" y="0"  width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="54" y="0"  width="16" height="16" rx="3" fill="#fafafa"/>

    <!-- Row 1: █  █ -->
    <rect x="0"  y="18" width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="54" y="18" width="16" height="16" rx="3" fill="#fafafa"/>

    <!-- Row 2: ████ -->
    <rect x="0"  y="36" width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="18" y="36" width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="36" y="36" width="16" height="16" rx="3" fill="#fafafa"/>
    <rect x="54" y="36" width="16" height="16" rx="3" fill="#fafafa"/>

    <!-- Row 3: █ -->
    <rect x="0"  y="54" width="16" height="16" rx="3" fill="#fafafa"/>
  </g>
</svg>
